[project]
name = "resqgrid-api"
version = "0.1.0"
description = "ResQGrid AI — FastAPI Backend Service"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

# Pre-existing modules with known type debt: still analysed (types are used)
# but their errors are not reported; CI gates strictness on the AI modules.
[[tool.mypy.overrides]]
module = ["app.models.*", "app.services.recommendation_service"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
