name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint new AI modules)
        run: ruff check app/ai app/allocation tests/test_optimizer.py tests/test_triage_ensemble.py tests/conftest.py tests/test_security.py

      - name: Mypy (strict, new AI modules)
        run: mypy app/ai app/allocation

      - name: Pytest
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing

  web:
    name: Web — type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security regression tests
        run: npm test -- --runInBand

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
