# =============================================================================
# ResQGrid AI — Docker Compose (Development)
# =============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up api web     # Start only API and web
#   docker compose down -v        # Stop and remove volumes
# =============================================================================

version: "3.9"

services:
  # ---- PostgreSQL with PostGIS ----
  postgres:
    image: postgis/postgis:16-3.4
    container_name: resqgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resqgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resqgrid_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-resqgrid_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resqgrid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: resqgrid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- FastAPI Backend ----
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: resqgrid-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-resqgrid}:${POSTGRES_PASSWORD:-resqgrid_dev_password}@postgres:5432/${POSTGRES_DB:-resqgrid_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-secure-random-string}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - MODEL_STUDIO_BASE_URL=${MODEL_STUDIO_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - MODEL_STUDIO_MODEL=${MODEL_STUDIO_MODEL:-qwen-plus}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app
      - ./packages:/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- Next.js Frontend ----
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: resqgrid-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_MAP_STYLE_URL=${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - ./packages:/packages
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
